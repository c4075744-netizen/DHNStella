<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--em:#0B4A2B;--gold:#C9A24D;--gg:linear-gradient(135deg,#F0DC9A,#C9A24D 50%,#8C6A23)}*{box-sizing:border-box;margin:0}
body{font:300 16px/1.6 Jost,sans-serif;color:#3b3a36;background:linear-gradient(160deg,#F4D9CB,#F8E7DE);min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--em);line-height:1.15}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--gold);background:rgba(248,231,222,.85)}.top img,.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold)}.tn{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:flex-end}.tn a{color:var(--em);text-decoration:none;font:500 .72rem Jost;letter-spacing:.14em;text-transform:uppercase}.top a.back{color:var(--em);text-decoration:none;font:500 .78rem Jost;letter-spacing:.15em;text-transform:uppercase}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:14px 28px;border-radius:50px;background:linear-gradient(180deg,#14633a,var(--em));color:#fff;border:1.5px solid var(--gold);font:500 .8rem Jost;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none}.btn.gold{background:var(--gg)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card{background:rgba(255,255,255,.65);border:1px solid var(--gold);border-radius:22px;padding:26px;box-shadow:0 10px 30px rgba(120,70,50,.12)}
.tn{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:flex-end}.tn a{color:var(--em);text-decoration:none;font:500 .72rem Jost;letter-spacing:.1em;text-transform:uppercase;padding-bottom:2px}.tn a.on{border-bottom:2px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand span{font:700 1.4rem/1 'Cormorant Garamond',serif;color:var(--em);display:flex;flex-direction:column;white-space:nowrap}.brand small{font:500 .5rem Jost;letter-spacing:.28em;text-transform:uppercase;margin-top:4px}header,.top{flex-wrap:wrap;gap:6px 12px}@media(max-width:520px){.brand small{display:none}.brand span{font-size:1.2rem}}
</style></head><body>

<style>.w{max-width:1080px;margin:auto;padding:36px 18px}h1{text-align:center;font-size:clamp(2rem,6vw,3rem)}.sub{text-align:center;font:500 .75rem Jost;letter-spacing:.4em;text-transform:uppercase;color:var(--em);margin-bottom:6px}
.fl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0}.fl button{padding:9px 20px;border-radius:30px;border:1px solid var(--gold);background:rgba(255,255,255,.6);color:var(--em);font:500 .75rem Jost;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.fl .on{background:var(--em);color:#fff}
.gr{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ba{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--gold);cursor:pointer;background:#d9b8a6}
.ba .a,.ba .b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 .8rem Jost;letter-spacing:.3em;text-transform:uppercase;color:#fff}.ba .a{background:linear-gradient(135deg,#e8c7b4,#c99a85)}.ba .b{background:linear-gradient(135deg,#8fb89f,#0B4A2B);clip-path:inset(0 0 0 50%)}
.ba input{position:absolute;inset:auto 10px 10px;width:calc(100% - 20px);accent-color:var(--gold)}
.lb{position:fixed;inset:0;background:rgba(20,10,8,.82);display:none;flex-direction:column;gap:18px;align-items:center;justify-content:center;padding:20px;z-index:20}.lb.open{display:flex}.lb .ba{width:min(92vw,720px);cursor:default}.x{position:absolute;top:14px;right:20px;color:#fff;font-size:2.2rem;background:none;border:0;cursor:pointer}</style>
<div class="w"><div class="sub">Работы</div><h1>До и после</h1>
<div class="fl" id="fl"><button class="on" data-f="all">Все</button><button data-f="Брови">Брови</button><button data-f="Губы">Губы</button><button data-f="Веки">Веки</button><button data-f="Ламинирование">Ламинирование</button></div>
<div class="gr" id="gl"></div><p style="text-align:center;margin-top:20px;font-style:italic">Нажмите на фото — откроется увеличенное изображение и кнопка «Заказать». Замените заглушки своими фото.</p></div>
<div class="lb" id="lb"><button class="x" id="x">×</button><div id="bx"></div><a class="btn gold" id="ord" href="order.html"><svg class="ic"><use href="#i-star"/></svg>Заказать</a></div>
<script>
const items=[['Брови'],['Брови'],['Губы'],['Губы'],['Веки'],['Ламинирование']],$=s=>document.querySelector(s);
const card=t=>`<div class="ba" data-c="${t}"><div class="a">До · ${t}</div><div class="b">После</div><input type="range" min="0" max="100" value="50"></div>`;
const sl=b=>{const r=b.querySelector('input');r.oninput=()=>b.querySelector('.b').style.clipPath=`inset(0 0 0 ${r.value}%)`;r.onclick=e=>e.stopPropagation()};
$('#gl').innerHTML=items.map(([t])=>card(t)).join('');
document.querySelectorAll('.ba').forEach(b=>{sl(b);b.onclick=()=>{$('#bx').innerHTML=card(b.dataset.c);sl($('#bx .ba'));$('#ord').href='order.html?service='+encodeURIComponent(b.dataset.c);$('#lb').classList.add('open')}});
$('#x').onclick=()=>$('#lb').classList.remove('open');$('#lb').onclick=e=>{if(e.target.id==='lb')$('#lb').classList.remove('open')};
document.querySelectorAll('#fl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fl button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('#gl .ba').forEach(x=>x.style.display=b.dataset.f==='all'||x.dataset.c===b.dataset.f?'':'none')});
</script><script>document.querySelectorAll('.tn a').forEach(a=>{if(a.getAttribute('href')===(location.pathname.split('/').pop()||'index.html'))a.classList.add('on')})</script></body></html>
